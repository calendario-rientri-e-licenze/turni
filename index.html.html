<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070F1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turni">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<title>Turni Lavoro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app mobile a colonna singola (max 460px) con tab bar fissa; tema scuro blu notte come nel mockup, verde = rientro 08/14, blu = rientro 15/18, rosso = festività. */
:root {
  color-scheme: dark;
  --bg: #070F1F;
  --bg-hi: #112650;
  --card: #0E1B35;
  --card-hi: #14284F;
  --line: #1D3157;
  --ink: #EAF1FB;
  --muted: #8FA2C0;
  --faint: #7F93B4;
  --m: #34D399;
  --m-ink: #052E22;
  --m-soft: rgba(52, 211, 153, 0.14);
  --p: #6C93FF;
  --p-ink: #0A1A4D;
  --p-soft: rgba(108, 147, 255, 0.16);
  --hol: #E0364C;
  --hol-ink: #FFFFFF;
  --hol-text: #FF7A89;
  --hol-soft: rgba(224, 54, 76, 0.16);
  --lv: #F5B544;
  --lv-ink: #2B1A00;
  --lv-soft: rgba(245, 181, 68, 0.16);
  --accent: #1C7BFF;
  --accent-ink: #FFFFFF;
  --danger: #FF6B7A;
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(120% 60% at 50% -10%, var(--bg-hi) 0%, transparent 70%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 0;
  min-height: 100vh;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; flex: none; }
.shell { max-width: 460px; margin: 0 auto; padding-bottom: 110px; display: grid; gap: 16px; }
.num, .tn { font-variant-numeric: tabular-nums; }

/* header */
.bar { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; min-height: 44px; }
.bar-t { font-size: 19px; font-weight: 700; text-align: center; letter-spacing: -0.01em; }
.bar-sp { width: 40px; }
.ib { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--ink); }
.ib:hover:not(:disabled) { background: var(--card-hi); }
.ib:disabled { opacity: 0.3; cursor: default; }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-width: 0; }
.sec { font-size: 16px; font-weight: 700; margin-top: 4px; }
.sec span { color: var(--muted); font-weight: 500; font-size: 14px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* home */
.brand { display: grid; justify-items: center; gap: 6px; padding: 20px 0 6px; text-align: center; }
.brand h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin-top: 8px; }
.brand p { color: var(--muted); }
.wk-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.wk-head h2 { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
.wk-head .rng { font-size: 12px; color: var(--muted); }
.wk-box { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 12px; background: rgba(7, 15, 31, 0.35); }
.wk-box > .lbl { font-size: 13px; font-weight: 600; }
.rrow { display: flex; align-items: center; gap: 12px; width: 100%; min-width: 0; }
.rrow .t { display: grid; min-width: 0; }
.rrow .t b { font-weight: 600; font-size: 14px; }
.rrow .t span { font-size: 14px; }
.rrow.m .t b { color: var(--m); }
.rrow.p .t b { color: var(--p); }
.rrow .when { margin-left: auto; font-size: 13px; color: var(--ink); white-space: nowrap; display: grid; text-align: right; line-height: 1.3; }
.dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.dot.m { background: var(--m); color: var(--m-ink); }
.dot.p { background: var(--p); color: var(--p-ink); }
.dot.sm { width: 20px; height: 20px; }
.links { display: grid; gap: 10px; }
.link { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; width: 100%; }
.link:hover { background: var(--card-hi); }
.link .tile { width: 40px; height: 40px; border-radius: 11px; background: #14284F; color: #6CA6FF; display: grid; place-items: center; flex: none; }
.link .tx { display: grid; min-width: 0; }
.link .tx b { font-weight: 600; font-size: 15px; }
.link .tx span { font-size: 12.5px; color: var(--muted); }
.link .chev { margin-left: auto; color: var(--muted); }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(7, 15, 31, 0.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs-in { max-width: 460px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tab { display: grid; justify-items: center; gap: 3px; padding: 6px 0; font-size: 10.5px; white-space: nowrap; color: var(--muted); border-radius: 10px; }
.tab[aria-current="page"] { color: #4C9BFF; font-weight: 700; }

/* month */
.mhead { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; }
.mhead h2 { text-align: center; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card); }
.mh { text-align: center; font-size: 12px; color: var(--muted); padding: 9px 0; box-shadow: inset 0 -1px 0 var(--line); }
.d { min-height: 56px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 0 4px; box-shadow: inset -1px -1px 0 var(--line); }
.d.oth { opacity: 0.35; }
.d .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
.d.we .n { color: var(--hol-text); }
.mh.we { color: var(--hol-text); }
.d.hol .n { background: var(--hol); color: var(--hol-ink); font-weight: 700; }
.d.today .n { box-shadow: 0 0 0 2px var(--accent); font-weight: 700; }
.d.hol.today .n { box-shadow: 0 0 0 2px var(--accent), 0 0 0 4px rgba(7, 15, 31, 1); }
button.d:hover { background: var(--card-hi); }
.bd { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; }
.bd.m { background: var(--m); color: var(--m-ink); }
.bd.p { background: var(--p); color: var(--p-ink); }
.bd.lv { background: var(--lv); color: var(--lv-ink); }
.dot.hol { background: var(--hol); color: var(--hol-ink); }
.rrow.h .t b { color: var(--hol-text); }
.pill.lv { background: var(--lv-soft); color: var(--lv); }
.list { display: grid; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.list .rrow { padding: 11px 12px; box-shadow: inset 0 -1px 0 var(--line); }
.list .rrow:last-child { box-shadow: none; }
.list .rrow:hover { background: var(--card-hi); }
.empty { padding: 16px; color: var(--muted); text-align: center; font-size: 14px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 16px; border-radius: 12px; font-weight: 600; width: 100%; border: 1px solid var(--line); background: var(--card); }
.btn:hover { background: var(--card-hi); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.btn.primary:hover { background: #3189FF; }
.btn.primary:disabled { opacity: 0.45; cursor: default; }
.btn.danger { color: var(--danger); border-color: rgba(255, 107, 122, 0.55); background: rgba(255, 107, 122, 0.06); }

/* year */
.ynav { display: flex; align-items: center; justify-content: center; gap: 6px; }
.ynav b { font-size: 22px; font-weight: 800; min-width: 3.6ch; text-align: center; letter-spacing: -0.01em; }
.ygrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mm { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 7px 6px 6px; display: grid; gap: 4px; min-width: 0; }
.mm:hover { background: var(--card-hi); }
.mm h3 { font-size: 12px; font-weight: 700; text-align: center; }
.mini { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; }
.mini i { font-style: normal; text-align: center; font-size: 8.5px; line-height: 14px; height: 14px; border-radius: 50%; font-variant-numeric: tabular-nums; }
.mini .wd { color: var(--muted); font-size: 8px; font-weight: 600; }
.mini .we { color: var(--hol-text); }
.mini .lv { background: var(--lv); color: var(--lv-ink); font-weight: 700; }
.mini .m { background: var(--m); color: var(--m-ink); font-weight: 700; }
.mini .p { background: var(--p); color: var(--p-ink); font-weight: 700; }
.mini .h { background: var(--hol); color: var(--hol-ink); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.legend .m { background: var(--m); }
.legend .p { background: var(--p); }
.legend .h { background: var(--hol); }
.legend .lv { background: var(--lv); }
.legend .w { background: transparent; box-shadow: inset 0 0 0 2px var(--hol-text); }

/* list view */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 4px; }
.stat .k { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.stat.m .k { color: var(--m); }
.stat.p .k { color: var(--p); }
.stat b { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.total { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; padding: 4px 4px 0; color: var(--muted); }
.total b { color: var(--ink); font-size: 17px; font-variant-numeric: tabular-nums; }
.grp { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.grp-h { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 13px 14px; font-weight: 700; }
.grp-h span { font-weight: 500; font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.grp-h .rot { transition: transform 0.15s; }
.grp-h[aria-expanded="true"] .rot { transform: rotate(90deg); }
.grp .rrow { padding: 10px 14px; box-shadow: inset 0 1px 0 var(--line); }
.grp .rrow:hover { background: var(--card-hi); }
.grp .rrow .dow { width: 7.5ch; font-size: 14px; font-variant-numeric: tabular-nums; }

/* settings */
.opt { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); width: 100%; }
.opt[aria-checked="true"] { border-color: var(--m); background: var(--m-soft); }
.opt .chk { margin-left: auto; color: var(--m); }
.opt .tile { color: var(--muted); }
.opt[aria-checked="true"] .tile { color: var(--m); }
.opts { display: grid; gap: 8px; }
.sgroup { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.srow { display: flex; align-items: center; gap: 12px; padding: 13px 14px; width: 100%; box-shadow: inset 0 -1px 0 var(--line); min-height: 52px; }
.srow:last-child { box-shadow: none; }
.srow .chev { margin-left: auto; color: var(--muted); }
.srow .tx { display: grid; min-width: 0; }
.srow .tx span { font-size: 12.5px; color: var(--muted); }
.times { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 14px 14px 52px; box-shadow: inset 0 -1px 0 var(--line); }
.times:last-child { box-shadow: none; }
.tin { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; font-variant-numeric: tabular-nums; color-scheme: dark; }
.sw { margin-left: auto; width: 48px; height: 28px; border-radius: 999px; background: #2A3D63; position: relative; flex: none; transition: background 0.15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
.sw[aria-checked="true"] { background: var(--m); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }

/* edit + exceptions */
.datecard { display: flex; align-items: center; gap: 8px; }
.datecard .mid { flex: 1; display: grid; gap: 6px; justify-items: start; min-width: 0; }
.datecard .dd { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--card-hi); color: var(--muted); }
.pill.m { background: var(--m-soft); color: var(--m); }
.pill.p { background: var(--p-soft); color: var(--p); }
.pill.h { background: var(--hol-soft); color: var(--hol); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pick { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-variant-numeric: tabular-nums; font-size: 14px; }
.pick .ring { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.pick.m[aria-pressed="true"] { border-color: var(--m); background: var(--m-soft); }
.pick.m[aria-pressed="true"] .ring { background: var(--m); border-color: var(--m); color: var(--m-ink); }
.pick.p[aria-pressed="true"] { border-color: var(--p); background: var(--p-soft); }
.pick.p[aria-pressed="true"] .ring { background: var(--p); border-color: var(--p); color: var(--p-ink); }
.pick.red[aria-pressed="true"] { border-color: var(--danger); background: rgba(255, 107, 122, 0.12); color: var(--danger); }
.pick.red[aria-pressed="true"] .ring { background: var(--danger); border-color: var(--danger); color: #3A0710; }
.field { width: 100%; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; color-scheme: dark; }
textarea.field { min-height: 92px; resize: vertical; }
.field::placeholder { color: #5F7498; }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { text-align: center; padding: 9px 8px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.exrow { display: flex; align-items: center; gap: 10px; padding: 12px; box-shadow: inset 0 -1px 0 var(--line); }
.exrow:last-child { box-shadow: none; }
.exrow .tx { display: grid; min-width: 0; flex: 1; }
.exrow .tx b { font-weight: 600; }
.exrow .tx span { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }

/* today */
.hero { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 16px; border: 1px solid var(--m); background: var(--m-soft); width: 100%; }
.hero.p { border-color: var(--p); background: var(--p-soft); }
.hero.none { border-color: var(--line); background: var(--card); }
.hero .ico { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--m); color: var(--m-ink); flex: none; }
.hero.p .ico { background: var(--p); color: var(--p-ink); }
.hero.none .ico { background: var(--card-hi); color: var(--muted); }
.hero .tx { display: grid; min-width: 0; }
.hero .tx span { font-size: 13px; color: var(--muted); }
.hero .tx b { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.hero.m .tx span { color: var(--m); }
.hero.p .tx span { color: var(--p); }
.hero .chev { margin-left: auto; color: var(--muted); }
.info { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); }
.info .tx { display: grid; }
.info .tx span { font-size: 13px; color: var(--muted); }
.info .chk { margin-left: auto; color: var(--m); }

/* licenze */
.ysel { appearance: none; -webkit-appearance: none; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 7px 18px; font: 800 20px/1.2 var(--font); text-align: center; text-align-last: center; cursor: pointer; font-variant-numeric: tabular-nums; color-scheme: dark; }
.lsum { display: grid; gap: 12px; }
.ls-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ls-top .big { font-size: 14px; color: var(--muted); }
.ls-top .big b { display: block; font-size: 38px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
.ls-top .big.over b { color: var(--danger); }
.stepper { display: flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.stepper .ib { width: 34px; height: 34px; font-size: 20px; font-weight: 700; text-align: center; }
.stepper span { display: grid; text-align: center; min-width: 5.4ch; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stepper span small { font-weight: 500; font-size: 10.5px; color: var(--muted); }
.pbar { display: flex; height: 12px; border-radius: 999px; background: var(--card-hi); overflow: hidden; }
.pbar i { display: block; height: 100%; }
.pbar .u, .pleg .u { background: var(--lv); }
.pbar .pl, .pleg .pl { background: repeating-linear-gradient(135deg, var(--lv) 0 4px, rgba(245, 181, 68, 0.38) 4px 8px); }
.pleg { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.pleg span { display: inline-flex; align-items: center; gap: 6px; }
.pleg i { width: 10px; height: 10px; border-radius: 3px; display: block; }
.pleg .r { background: var(--card-hi); border: 1px solid var(--line); }
.pleg b { color: var(--ink); font-variant-numeric: tabular-nums; }
.strip { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 8px; display: grid; gap: 3px; }
.srow2, .ticks { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px; align-items: center; }
.srow2 .ml { font-size: 10.5px; color: var(--muted); text-transform: capitalize; }
.cells { display: grid; grid-template-columns: repeat(31, minmax(0, 1fr)); gap: 1.5px; }
.cells i { display: block; height: 13px; border-radius: 2px; background: var(--card-hi); cursor: pointer; }
.cells i.x { visibility: hidden; cursor: default; }
.cells i.m { background: var(--m); }
.cells i.lv { background: var(--lv); }
.cells i.h { background: var(--hol); }
.cells i.w { background: rgba(224, 54, 76, 0.38); }
.cells i.t { box-shadow: 0 0 0 1.5px var(--ink); }
.ticks .cells i { height: auto; background: none; font-style: normal; font-size: 9px; color: var(--muted); grid-column-end: span 2; cursor: default; font-variant-numeric: tabular-nums; }
.lcard, .bcard { display: grid; gap: 6px; padding: 13px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; width: 100%; min-width: 0; }
.lcard:hover { background: var(--card-hi); }
.lc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.lc-top b { font-weight: 700; }
.lc-meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.cardlist { display: grid; gap: 10px; }
.bcard .bt { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.bcard .bt b { font-weight: 700; }
.bcard .bt span { font-size: 13px; color: var(--hol-text); font-weight: 600; }
.bcard .go { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/*LOGIC*/
const DAY = 86400000;
const PAIRS = [[1, 3], [2, 4], [3, 5]];
const PAIR_LABEL = ['lunedì e mercoledì', 'martedì e giovedì', 'mercoledì e venerdì'];
const PAIR_TITLE = ['Lunedì / Mercoledì', 'Martedì / Giovedì', 'Mercoledì / Venerdì'];
const ANCHOR = Date.UTC(2026, 9, 26);
const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const MESI_ABBR = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const GIORNI = ['lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato', 'domenica'];
const GIORNI_ABBR = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
const pad = (n) => String(n).padStart(2, '0');
const keyOf = (t) => { const d = new Date(t); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
const wdOf = (t) => { const g = new Date(t).getUTCDay(); return g === 0 ? 7 : g; };
const S0 = { pairOffset: 0, accr: { ord: 39, spe: 4 }, anch: {}, taken: {}, hours: { m: ['08:00', '14:00'], p: ['15:00', '18:00'] }, weekend: true, holidays: true };
let S = JSON.parse(JSON.stringify(S0));
let O = {};
let L = [];
let F = [];
let LM = new Map();
function weekPair(t) {
  const mon = t - (wdOf(t) - 1) * DAY;
  const w = Math.round((mon - ANCHOR) / (7 * DAY));
  return (((w + S.pairOffset) % 3) + 3) % 3;
}
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return Date.UTC(y, month - 1, day);
}
function holidays(y) {
  const m = new Map();
  const add = (mo, d, n) => m.set(keyOf(Date.UTC(y, mo - 1, d)), n);
  add(1, 1, 'Capodanno'); add(1, 6, 'Epifania'); add(4, 25, 'Liberazione');
  add(5, 1, 'Festa del Lavoro'); add(6, 2, 'Festa della Repubblica'); add(8, 15, 'Ferragosto');
  add(11, 1, 'Ognissanti'); add(12, 8, 'Immacolata'); add(12, 25, 'Natale'); add(12, 26, 'Santo Stefano');
  const e = easter(y);
  m.set(keyOf(e), 'Pasqua'); m.set(keyOf(e + DAY), 'Pasquetta');
  return m;
}
const holCache = {};
const holOf = (y) => holCache[y] || (holCache[y] = holidays(y));
function info(t) {
  const wd = wdOf(t), key = keyOf(t), y = new Date(t).getUTCFullYear();
  const hol = holOf(y).get(key) || null;
  const pair = weekPair(t);
  const [a, b] = PAIRS[pair];
  const sched = wd === a || wd === b;
  const holActive = !!hol && S.holidays;
  const leave = LM.get(key) || null;
  const leaveDay = !!leave && wd <= 5 && !holActive;
  const autoShift = sched && !holActive && !leaveDay ? 'm' : null;
  const ov = O[key];
  let shift = autoShift;
  if (ov) { if (ov.off) shift = null; else if (ov.shift) shift = 'm'; }
  return { t, key, wd, hol, holActive, pair, weekend: wd >= 6, sched, skipped: sched && (holActive || leaveDay), autoShift, ov, shift, note: (ov && ov.note) || '', leave, leaveDay };
}
const TYPES = { ferie: 'Licenza Ordinaria', speciale: 'Licenza Speciale', permesso: 'Permesso', altro: 'Altra assenza' };
const KIND = { ferie: 'ord', speciale: 'spe' };
const KLAB = { ord: 'Licenza Ordinaria', spe: 'Licenza Speciale' };
const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d); };
function rebuildLM() {
  LM = new Map();
  L.forEach((lv) => {
    const a = parseKey(lv.from), b = parseKey(lv.to);
    for (let t = a, n = 0; t <= b && n < 800; t += DAY, n++) if (!LM.has(keyOf(t))) LM.set(keyOf(t), lv);
  });
}
/*END LOGIC*/

const KEY = 'turni-lavoro-v1';
function applyState(d) {
  if (!d || typeof d !== 'object') return;
  let migrated = false;
  if (d.S) {
    const o = d.S.open;
    S = Object.assign({}, S0, d.S, { hours: Object.assign({}, S0.hours, d.S.hours || {}), accr: Object.assign({}, S0.accr, d.S.accr || {}), anch: Object.assign({}, d.S.anch || {}), taken: Object.assign({}, d.S.taken || {}) });
    if (o && d.S.openDone) [2024, 2025].forEach((y) => ['ord', 'spe'].forEach((k) => { const v = o[y] && o[y][k]; if (typeof v === 'number') S.anch['2026|' + y + '|' + k] = v; }));
    delete S.open; delete S.openDone;
  }
  if (d.O) O = d.O;
  if (Array.isArray(d.L)) L = d.L;
  if (Array.isArray(d.F) && d.F.length) {
    d.F.forEach((f) => { const C = f.comp || (f.k === 'spe' ? f.y : Math.max(2024, f.y - 2)); const key = f.y + '|' + C + '|' + f.k; S.taken[key] = (S.taken[key] || 0) + f.n; });
    migrated = true;
  }
  rebuildLM();
  if (migrated) save();
}
function load() { try { const r = localStorage.getItem(KEY); if (r) applyState(JSON.parse(r)); } catch (e) { /* si lavora in memoria */ } }
let DB = null, dbTimer = null;
function pushDb() {
  if (!DB) return;
  clearTimeout(dbTimer);
  dbTimer = setTimeout(() => { let ts = Date.now(); try { ts = Number(localStorage.getItem('turni-ts')) || ts; } catch (e) { /* ignore */ } DB.set({ v: 2, S, O, L, ts }).catch(() => { /* resta la copia locale */ }); }, 700);
}
function save() { try { localStorage.setItem(KEY, JSON.stringify({ S, O, L })); localStorage.setItem('turni-ts', String(Date.now())); } catch (e) { /* ignore */ } pushDb(); }
load();

const now = new Date();
const TODAY = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
const TY = new Date(TODAY).getUTCFullYear();
const TM = new Date(TODAY).getUTCMonth();

  screen: 'home', stack: [], calView: 'month',
  cal: { y: TY, m: TM }, year: TY, sel: TODAY,

};

const $app = document.getElementById('app');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const dN = (t) => new Date(t).getUTCDate();
const mo = (t) => new Date(t).getUTCMonth();
const yr = (t) => new Date(t).getUTCFullYear();

const fmtMed = (t) => cap(GIORNI[wdOf(t) - 1]) + ' ' + dN(t) + ' ' + MESI_ABBR[mo(t)] + ' ' + yr(t);
const fmtShort = (t) => GIORNI_ABBR[wdOf(t) - 1] + ' ' + dN(t) + ' ' + MESI_ABBR[mo(t)];
const rng1 = (s) => S.hours[s][0] + ' - ' + S.hours[s][1];
const rng = () => rng1('m') + ' e ' + rng1('p');
const stack = () => '<span>' + rng1('m') + '</span><span>' + rng1('p') + '</span>';
const hh = (v) => (v.endsWith(':00') ? v.slice(0, 2) : v);
const lab1 = (s) => hh(S.hours[s][0]) + '/' + hh(S.hours[s][1]);
const lab = () => lab1('m') + ' e ' + lab1('p');
const daysIn = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();

const P = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',

  calcheck: '<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="M9 15.5l2 2 4-4"/>',

  check: '<path d="M5 12l4.5 4.5L19 7"/>',

  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',

const ic = (n, s = 20) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + P[n] + '</svg>';

}

/* ---------- screens ---------- */
function homeScreen() {
  const start = TODAY + (8 - wdOf(TODAY)) * DAY;
  const end = start + 6 * DAY;
  const rows = [];
  for (let t = start; t <= end; t += DAY) { const i = info(t); if (i.shift) rows.push(i); }
  const range = 'Dal ' + dN(start) + ' ' + MESI_ABBR[mo(start)] + ' al ' + dN(end) + ' ' + MESI_ABBR[mo(end)] + ' ' + yr(end);

/* ---------- programmazione licenze ---------- */
const dayShort = (t) => GIORNI_ABBR[wdOf(t) - 1] + ' ' + dN(t) + ' ' + MESI_ABBR[mo(t)];
const pl = (n, one, many) => n + ' ' + (n === 1 ? one : many);
function fmtRange(a, b) {
  if (a === b) return fmtMed(a);
  if (mo(a) === mo(b) && yr(a) === yr(b)) return dN(a) + '–' + dN(b) + ' ' + MESI_ABBR[mo(a)] + ' ' + yr(a);
  return dN(a) + ' ' + MESI_ABBR[mo(a)] + (yr(a) !== yr(b) ? ' ' + yr(a) : '') + ' – ' + dN(b) + ' ' + MESI_ABBR[mo(b)] + ' ' + yr(b);
}
const isWork = (t) => { const i = info(t); return i.wd <= 5 && !i.holActive; };
const isOff = (t) => { const i = info(t); return i.wd >= 6 || i.holActive; };
const baseRientro = (t) => { const i = info(t); return i.sched && !i.holActive; };
function workDays(a, b) { let n = 0; for (let t = a; t <= b && t - a < 800 * DAY; t += DAY) if (isWork(t)) n++; return n; }
function restSpan(a, b) {
  let s = a, e = b;
  while (isOff(s - DAY) && a - s < 12 * DAY) s -= DAY;
  while (isOff(e + DAY) && e - b < 12 * DAY) e += DAY;
  return { s, e, days: Math.round((e - s) / DAY) + 1 };
}
function leaveStats(list, y) {
  const st = { ferie: 0, speciale: 0, permesso: 0, altro: 0, rientri: 0 };
  const y0 = Date.UTC(y, 0, 1), y1 = Date.UTC(y, 11, 31);
  list.forEach((lv) => {
    const a = Math.max(parseKey(lv.from), y0), b = Math.min(parseKey(lv.to), y1);
    for (let t = a; t <= b; t += DAY) {
      if (!isWork(t)) continue;
      st[lv.type]++;
      if (baseRientro(t)) st.rientri++;
    }
  });
  return st;
}
/* Competenze: ogni 1 gennaio maturano i giorni (39 ordinaria, 4 speciale). Ogni competenza è fruibile fino al 30 giugno di due anni dopo (18 mesi dopo la fine dell'anno). Si consuma prima la competenza che scade prima, salvo scelta manuale. I saldi inseriti a mano al 1 gennaio sostituiscono il calcolo da quella data. */
function simulate(list, upto, asOf) {
  const K = ['ord', 'spe'];
  const res = { ord: {}, spe: {}, by: {}, upto };
  K.forEach((k) => { for (let C = 2024; C <= upto; C++) res[k][C] = { y: C, kind: k, total: 0, open: 0, rem: 0, used: 0, plan: 0, over: 0, lost: 0, manual: false, openManual: false, man: 0, app: 0, start: Date.UTC(C, 0, 1), exp: expOf(k, C) }; });
  const end = Date.UTC(upto, 11, 31), snapT = Date.UTC(upto, 0, 1);
  const ev = [];
  K.forEach((k) => {
    for (let C = 2024; C <= upto; C++) {
      ev.push({ t: Date.UTC(C, 0, 1), p: 0, ty: 'acc', k, C });
      if (expOf(k, C) <= end && (asOf === undefined || expOf(k, C) <= asOf)) ev.push({ t: expOf(k, C), p: 3, ty: 'exp', k, C });
    }
  });
  Object.keys(S.anch).forEach((key) => {
    const [Y, C, k] = key.split('|');
    if (+Y >= 2024 && +Y <= upto && res[k] && res[k][+C] && +Y >= +C && +Y <= (k === 'ord' ? +C + 2 : +C)) ev.push({ t: Date.UTC(+Y, 0, 1), p: 0.5, ty: 'anc', k, C: +C, v: S.anch[key], Y: +Y });
  });
  Object.keys(S.taken).forEach((key) => { const [Y, C, k] = key.split('|'), n = S.taken[key]; if (+Y >= 2024 && +Y <= upto && res[k] && res[k][+C] && n > 0) ev.push({ t: Date.UTC(+Y, 0, 1), p: 1, ty: 'man', k, f: { comp: +C, n } }); });
  list.forEach((lv) => {
    const k = KIND[lv.type];
    if (!k) return;
    const a = parseKey(lv.from), b = Math.min(parseKey(lv.to), end);
    for (let t = a; t <= b && t - a < 800 * DAY; t += DAY) if (isWork(t)) ev.push({ t, p: 2, ty: 'day', k, id: lv.id, comp: lv.comp });
  });
  ev.sort((x, y) => x.t - y.t || x.p - y.p);
  let snapped = false;

function pdfMonthPage(d, y, m) {

    d.setTextColor(...(c > 4 && S.weekend ? PC.weInk : PC.ink)); d.text(n, x0 + c * cw + cw / 2, y0 + 4.8, { align: 'center' });
  });

  }

function pdfLicenze(d, y) {
  pdfHead(d, 'Licenze ' + y, 'Situazione a fine anno, comprese le licenze pianificate');
  const sim = simulate(L, y, asOfFor(y));
  let ty = 38;
  ['ord', 'spe'].forEach((k) => {
    ty = ensure(d, ty, 50); pdfH(d, KLAB[k] + (k === 'spe' ? ' (festività soppresse)' : ''), ty); ty += 5;
    d.setFont('helvetica', 'bold'); d.setFontSize(8.5); d.setTextColor(...PC.mute);
    d.text('Competenza', 14, ty); d.text('Al 1 gen', 50, ty); d.text('Fruiti a mano', 72, ty); d.text('Con date', 100, ty); d.text('Residuo', 124, ty); d.text('Fruibile fino al', 146, ty);
    d.setDrawColor(...PC.line); d.line(14, ty + 2, 196, ty + 2); ty += 7;
    d.setFont('helvetica', 'normal'); d.setFontSize(9.5); d.setTextColor(...PC.ink);
    Object.values(sim[k]).filter((a) => a.y >= (k === 'ord' ? y - 2 : y) && a.y <= y && (a.open || a.total || a.used || a.plan || a.lost)).forEach((a) => {
      d.text(String(a.y), 14, ty); d.text(String(a.open) + (a.openManual ? ' *' : ''), 50, ty); d.text(String(a.man), 72, ty); d.text(String(a.app), 100, ty);
      d.setFont('helvetica', 'bold'); d.text(String(a.rem), 124, ty); d.setFont('helvetica', 'normal');
      d.text(fmtExp(a.exp) + (a.lost ? '  (' + a.lost + ' persi)' : ''), 146, ty); ty += 6;
    });
    ty += 6;
  });
  d.setFontSize(8); d.setTextColor(...PC.mute); d.text('* saldo inserito a mano al 1 gennaio', 14, ty - 2); ty += 6;
  const yl = L.filter((l) => yr(parseKey(l.from)) <= y && yr(parseKey(l.to)) >= y);
  ty = ensure(d, ty, 20); pdfH(d, 'Licenze pianificate e fruite (' + yl.length + ')', ty); ty += 6;
  const bys = simulate(L, y, asOfFor(y)).by;
  if (!yl.length) { d.setFontSize(9); d.setTextColor(...PC.mute); d.text('Nessuna licenza nel ' + y + '.', 14, ty); ty += 7; }
  yl.forEach((l) => {
    const a = parseKey(l.from), b = parseKey(l.to), by = bys[l.id];
    ty = ensure(d, ty, 12);
    d.setFont('helvetica', 'bold'); d.setFontSize(9.5); d.setTextColor(...PC.ink); d.text(fmtRange(a, b) + '   ' + TYPES[l.type], 14, ty);
    d.setFont('helvetica', 'normal'); d.setFontSize(8.5); d.setTextColor(...PC.mute);
    const use = by ? Object.keys(by).filter((q) => q !== 'over').map((q) => by[q] + ' dalla ' + q).join(' + ') : '';
    d.text(pl(workDays(a, b), 'giorno lavorativo', 'giorni lavorativi') + (use ? '  |  usa ' + use : '') + (l.note ? '  |  ' + l.note : ''), 14, ty + 4.4);
    ty += 10.5;
  });
}

/* ---------- accesso e sincronizzazione (Supabase) ---------- */
let cfgLS = null;
try { cfgLS = JSON.parse(localStorage.getItem('turni-sb') || 'null'); } catch (e) { cfgLS = null; }
const SB = window.TURNI_CONFIG && window.TURNI_CONFIG.url && window.TURNI_CONFIG.anon ? window.TURNI_CONFIG : (cfgLS && cfgLS.url && cfgLS.anon ? cfgLS : null);
function setupScreen() {
  let el = document.getElementById('auth');
  if (!el) { el = document.createElement('div'); el.id = 'auth'; document.body.appendChild(el); }
  el.style.cssText = 'position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px;overflow:auto';
  el.innerHTML = '<form class="card" style="width:min(380px,100%);gap:12px;display:grid"><h1 style="margin:0;font-size:26px">Collega il tuo archivio</h1>' +
    '<p class="muted small" style="margin:0">Incolla i due dati del tuo progetto Supabase. Servono solo la prima volta su questo dispositivo.</p>' +
    '<label class="sec" for="su-u" style="margin:0">Indirizzo del progetto (Project URL)</label><input class="field" id="su-u" type="text" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://xxxx.supabase.co" required style="min-height:0;height:48px">' +
    '<label class="sec" for="su-k" style="margin:0">Chiave pubblica (anon public)</label><input class="field" id="su-k" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" required style="min-height:0;height:48px">' +
    '<p id="su-m" role="alert" class="small" style="margin:0;color:var(--danger);min-height:1em"></p>' +
    '<button class="btn primary" type="submit">Continua</button><button class="btn" type="button" id="su-l">Usa solo su questo dispositivo</button></form>';
  const f = el.querySelector('form');
  el.querySelector('#su-l').addEventListener('click', () => { try { localStorage.setItem('turni-local', '1'); } catch (e) { /* ignore */ } el.remove(); });
  f.addEventListener('submit', (ev) => {
    ev.preventDefault();
    let url = f.querySelector('#su-u').value.trim().replace(/\/+$/, ''); const anon = f.querySelector('#su-k').value.trim();
    if (!/^https?:\/\//.test(url)) url = 'https://' + url;
    if (!/supabase\.co$/.test(url) || anon.length < 20) { f.querySelector('#su-m').textContent = 'Controlla i due dati: l’indirizzo termina con .supabase.co e la chiave è lunga.'; return; }
    try { localStorage.setItem('turni-sb', JSON.stringify({ url, anon })); localStorage.removeItem('turni-local'); } catch (e) { /* ignore */ }
    location.reload();
  });
}
let AUTH = null;
try { AUTH = JSON.parse(localStorage.getItem('turni-auth') || 'null'); } catch (e) { AUTH = null; }
function setAuth(j) {
  if (!j) { AUTH = null; try { localStorage.removeItem('turni-auth'); } catch (e) { /* ignore */ } return; }
  AUTH = { access_token: j.access_token, refresh_token: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000 - 60000, email: (j.user && j.user.email) || (AUTH && AUTH.email) || '' };
  try { localStorage.setItem('turni-auth', JSON.stringify(AUTH)); } catch (e) { /* ignore */ }
}
async function sbAuth(path, body) {
  const r = await fetch(SB.url + '/auth/v1/' + path, { method: 'POST', headers: { apikey: SB.anon, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error_description || j.msg || j.message || 'Errore'); e.status = r.status; throw e; }
  return j;
}
async function getToken() {
  if (!AUTH) return null;
  if (Date.now() > AUTH.exp) {
    try { setAuth(await sbAuth('token?grant_type=refresh_token', { refresh_token: AUTH.refresh_token })); }
    catch (e) { if (e.status) { setAuth(null); return null; } }
  }
  return AUTH && AUTH.access_token;
}
const subOf = (tk) => { try { return JSON.parse(atob(tk.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub; } catch (e) { return null; } };
async function rest(method, qs, body) {
  const tk = await getToken();
  if (!tk) throw new Error('auth');
  const h = { apikey: SB.anon, Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json' };
  if (method === 'POST') h.Prefer = 'resolution=merge-duplicates,return=minimal';
  const r = await fetch(SB.url + '/rest/v1/app_state' + qs, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error('http ' + r.status);
  return method === 'GET' ? r.json() : null;
}
const remote = {
  get: async () => { const rows = await rest('GET', '?select=data&limit=1'); return rows && rows[0] ? rows[0].data : null; },
  set: async (data) => { const tk = await getToken(); await rest('POST', '?on_conflict=user_id', { user_id: subOf(tk), data, updated_at: new Date().toISOString() }); },
};
const localTs = () => { try { return Number(localStorage.getItem('turni-ts')) || 0; } catch (e) { return 0; } };
async function pull(force) {
  try {
    const d = await remote.get();
    if (!d) { if (localStorage.getItem(KEY)) pushDb(); return; }
    if (force || (d.ts || 0) > localTs()) {
      if (['leaveform', 'edit'].includes(state.screen) && !force) return;
      applyState(d);
      try { localStorage.setItem(KEY, JSON.stringify({ S, O, L })); localStorage.setItem('turni-ts', String(d.ts || Date.now())); } catch (e) { /* ignore */ }
      render();
    } else if ((d.ts || 0) < localTs()) pushDb();
  } catch (e) { /* offline: si lavora in locale */ }
}
function authScreen(msg) {
  let el = document.getElementById('auth');
  if (!el) { el = document.createElement('div'); el.id = 'auth'; document.body.appendChild(el); }
  el.style.cssText = 'position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px;overflow:auto';
  el.innerHTML = '<form class="card" id="auth-f" style="width:min(380px,100%);gap:12px;display:grid"><h1 style="margin:0;font-size:26px">Turni Lavoro</h1>' +
    '<p class="muted small" style="margin:0">Accedi per ritrovare i tuoi dati su iPhone e computer.</p>' +
    '<label class="sec" for="au-e" style="margin:0">Email</label><input class="field" id="au-e" type="email" autocomplete="username" required style="min-height:0;height:48px">' +
    '<label class="sec" for="au-p" style="margin:0">Password <span>(almeno 8 caratteri)</span></label><input class="field" id="au-p" type="password" autocomplete="current-password" minlength="8" required style="min-height:0;height:48px">' +
    '<p id="au-m" role="alert" class="small" style="margin:0;color:var(--danger);min-height:1em">' + esc(msg || '') + '</p>' +
    '<button class="btn primary" type="submit" data-m="in">Accedi</button><button class="btn" type="submit" data-m="up">Crea account</button></form>';
  const f = el.querySelector('form'); let mode = 'in';
  f.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { mode = b.dataset.m; }));
  f.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const body = { email: f.querySelector('#au-e').value.trim(), password: f.querySelector('#au-p').value }, m = f.querySelector('#au-m');
    m.style.color = 'var(--muted)'; m.textContent = 'Attendere…';
    try {
      if (mode === 'up') {
        const j = await sbAuth('signup', body);
        if (!j.access_token) { m.textContent = 'Account creato: conferma l’email ricevuta, poi accedi.'; return; }
        setAuth(j);
      } else setAuth(await sbAuth('token?grant_type=password', body));
      DB = remote; el.remove(); await pull(true); render();
    } catch (e) { m.style.color = 'var(--danger)'; m.textContent = /Invalid login/i.test(e.message) ? 'Email o password non corrette.' : e.message === 'Failed to fetch' ? 'Nessuna connessione.' : e.message; }
  });
}
async function initDb() {
  if (!SB) { let l = null; try { l = localStorage.getItem('turni-local'); } catch (e) { /* ignore */ } if (!l) setupScreen(); return; }
  if (!await getToken()) authScreen();
  else { DB = remote; await pull(false); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && AUTH) pull(false); });
  setInterval(() => { if (!document.hidden && AUTH) pull(false); }, 60000);
}
function logout() { setAuth(null); try { localStorage.removeItem(KEY); localStorage.removeItem('turni-ts'); } catch (e) { /* ignore */ } location.reload(); }

render();
initDb();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
